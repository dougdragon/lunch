<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunch generator</title>
    <link rel="stylesheet" href="https://assets.dougdragon.com/uikit.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <!-- Matomo -->
    <script>
        var _paq = window._paq = window._paq || [];
        /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        (function() {
            var u="//a.dougdragon.com/matomo/";
            _paq.push(['setTrackerUrl', u+'matomo.php']);
            _paq.push(['setSiteId', '3']);
            var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
            g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
        })();
    </script>
    <!-- End Matomo Code -->
     <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body style="text-align: center; margin-top: 2%;">
    <h1>Lunch generator</h1>
    <p>Click the button (<em>or press the spacebar</em>) to generate a random lunch idea.</p>
    <button id="generate-lunch" class="uk-button uk-button-primary" disabled>Loading options...</button>
    <div id="lunch-idea" class="uk-margin-top"></div>
    <div id="copy-container" class="uk-margin-small-top" style="display: none;">
        <a href="#" id="screenshot-page" class="uk-text-meta">Save screenshot</a>&nbsp;|&nbsp;
        <a href="#" id="copy-text" class="uk-text-meta">Copy text</a>
    </div>

    <script>
        let options = [];
        let lunchOption;
        let previousDecision;
        let buttonText;
        const button = document.getElementById('generate-lunch');
        const lunchSelection = document.getElementById('lunch-idea');

        const getLunchOptions = async () => {
            const response = await fetch('https://api.dougdragon.com/lunch/');
            const result = await response.json();
            console.log(result);
            options = result;
        }

        const generateRandom = (length) =>
            Math.floor(Math.random() * length);

        const getButtonText = () => {
            const options = [
                'Nah, give me another option',
                'I don\'t want that, give me another one',
                'NEXT!',
                'Eww, David.',
                'I\'m not feeling that, what else ya got?'
            ]

            return options[generateRandom(options.length)];
        }

        const generateImageName = () => {
            currentDate = new Date();
            const months = ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12"];
            const month = months[currentDate.getMonth()]
            fileName = `${currentDate.getFullYear()}-${month}-${currentDate.getDate()}_lunchOption.png`;

            return fileName;
        };

        window.onload = async () => {
            button.disabled = true; // Ensure button is disabled before loading
            await getLunchOptions();
            button.disabled = false; // Enable button after options are loaded
            // Set the button text after options have loaded
						button.focus(); // Set the focus on the button
            button.textContent = 'Generate lunch';
        }

        button.addEventListener('click', () => {
            if (options.length === 0) {
                lunchSelection.innerText = "No options available.";
                return;
            }
            lunchOption = options[generateRandom(options.length)];
            while (lunchOption === previousDecision) {
                // Handle when random picks the same as previously picked
                console.log(`WTF: random didn\'t random: ${lunchOption}`);
                lunchOption = options[generateRandom(options.length)];
            }

            lunchSelection.innerHTML = `<span class="uk-text-lead">${lunchOption}</span>`
            previousDecision = lunchOption;

            document.getElementById('copy-container').style.display = 'inline'; // unhide

            // Update the button text
            var currentButtonText = button.textContent;
            randomButtonText = getButtonText();
            while (randomButtonText == currentButtonText) {
                console.log(`WTF: random button didn\'t random: ${currentButtonText}`);
                randomButtonText = getButtonText();
            }
            button.textContent = randomButtonText;
        });

        const copyToClipboard = async () => {
            const lunchText = lunchSelection.innerText; // Grabs text from the span
            const textToCopy = `Mr. Dragon's generator says you should go to ${lunchText} for lunch today. Enjoy!`;
            try {
                await navigator.clipboard.writeText(textToCopy);
                const copyLink = document.getElementById('copy-text');
                const originalText = copyLink.innerText;
                copyLink.innerText = "This lunch option has been copied to your clipboard!";
                setTimeout(() => { copyLink.innerText = originalText; }, 4000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        };

        const downloadScreenshot = () => {
            const element = document.getElementById('lunch-idea');
            html2canvas(element).then(canvas => {
                const link = document.createElement('a');
                link.download = generateImageName();
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        };

        document.getElementById("screenshot-page").addEventListener('click', (e) => {
            e.preventDefault();
            downloadScreenshot();
        });

        document.getElementById('copy-text').addEventListener('click', (e) => {
            e.preventDefault();
            copyToClipboard();
        });
    </script>
</body>
</html>
